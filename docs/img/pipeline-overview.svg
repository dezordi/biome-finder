<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="906" viewBox="0 0 1100 906" font-family="Helvetica, Arial, sans-serif">
  <title>biome-finder steps and the data each one reads</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a99"/></marker>
    <style>
      .box { fill: #f5f8fb; stroke: #c9d6e3; stroke-width: 1.2; }
      .sources { fill: #fbfbf8; stroke: #d8d8cf; stroke-width: 1.2; }
      .human { fill: #fff7e6; stroke: #E69F00; stroke-dasharray: 4 3; }
      .badge { fill: #0072B2; }
      .badge-text { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .title { font-size: 15px; font-weight: bold; fill: #1f2933; }
      .heading { font-size: 14px; font-weight: bold; fill: #1f2933; }
      .status { font-size: 11.5px; font-weight: bold; }
      .implemented { fill: #009E73; }
      .planned { fill: #8a94a0; }
      .detail { font-size: 12.5px; fill: #44515e; }
      .output { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #0b4f8a; }
      .source { font-size: 12px; fill: #1f2933; }
      .skip { font-size: 12px; fill: #D55E00; font-weight: bold; }
      .human-text { font-size: 12px; fill: #7a5200; font-style: italic; }
      .downstream { font-size: 13px; fill: #ffffff; font-weight: bold; }
      .flow { stroke: #7a8a99; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="906" fill="#ffffff"/>
  <text x="20" y="40" class="heading">steps</text>
  <text x="570" y="40" class="heading">data it reads</text>
  <rect x="20" y="60" width="520" height="158" rx="6" class="box"/>
  <circle cx="42" cy="82" r="11" class="badge"/><text x="42" y="86" class="badge-text">1</text>
  <text x="62" y="87" class="title">biome-finder survey</text>
  <text x="526" y="86" class="status implemented" text-anchor="end">implemented</text>
  <text x="42" y="112" class="detail">Counts the public data per candidate biome, before any curation:</text>
  <text x="42" y="130" class="detail">MAGs, MGnify bins, assemblies and runs of the config&#x27;s kingdom.</text>
  <text x="42" y="148" class="detail">Decides which catalogues to build, or which MGnify ones to update.</text>
  <text x="42" y="176" class="output">→ survey/  survey.tsv · biomes/&lt;name&gt;/ · report.html</text>
  <rect x="570" y="60" width="510" height="158" rx="6" class="sources"/>
  <line x1="570" y1="139.0" x2="544" y2="139.0" class="flow" marker-end="url(#arrow)"/>
  <text x="586" y="86" class="source">• ENA Portal API: MAGs, bins, assemblies, runs, samples, studies</text>
  <text x="586" y="104" class="source">• ENA Browser XML: derived from (genome → source samples)</text>
  <text x="586" y="122" class="source">• ENA taxonomy: metagenome taxa → tax IDs</text>
  <text x="586" y="140" class="source">• MGnify API v1/v2 + FTP: existing catalogues (context only)</text>
  <text x="586" y="164" class="skip">no papers, no LLM, no NCBI, no GOLD, no composition</text>
  <text x="586" y="182" class="skip">only metadata already public in ENA</text>
  <line x1="280" y1="218" x2="280" y2="278" class="flow" marker-end="url(#arrow)"/>
  <rect x="30" y="236" width="500" height="26" rx="13" class="human"/>
  <text x="280" y="254" class="human-text" text-anchor="middle">curator: picks 1–2 biomes and refines their YAML (define-biome)</text>
  <rect x="20" y="282" width="520" height="140" rx="6" class="box"/>
  <circle cx="42" cy="304" r="11" class="badge"/><text x="42" y="308" class="badge-text">2</text>
  <text x="62" y="309" class="title">biome-finder search</text>
  <text x="526" y="308" class="status planned" text-anchor="end">planned</text>
  <text x="42" y="334" class="detail">One row per record: data type, resolved taxonomy, biome evidence,</text>
  <text x="42" y="352" class="detail">score and tier. Rule-based actions first; papers, LLM and</text>
  <text x="42" y="370" class="detail">composition only for records that are still uncertain.</text>
  <text x="42" y="398" class="output">→ samples.tsv</text>
  <rect x="570" y="282" width="510" height="140" rx="6" class="sources"/>
  <line x1="570" y1="352.0" x2="544" y2="352.0" class="flow" marker-end="url(#arrow)"/>
  <text x="586" y="308" class="source">• ENA Portal / Browser / xref · NCBI E-utilities, FTP, taxdump</text>
  <text x="586" y="326" class="source">• MGnify, GOLD, Metalog, mag-provenance</text>
  <text x="586" y="344" class="source">• papers: Europe PMC open access + curator PDFs (--papers-dir)</text>
  <text x="586" y="362" class="source">• LLM on the retrieved text (--llm), quotes verified</text>
  <text x="586" y="380" class="source">• composition (--composition): Trapiche on MGnify taxonomy files</text>
  <text x="586" y="398" class="source">•   + our text evidence; IndicPiper on Sandpiper GTDB profiles</text>
  <line x1="280" y1="422" x2="280" y2="482" class="flow" marker-end="url(#arrow)"/>
  <rect x="30" y="440" width="500" height="26" rx="13" class="human"/>
  <text x="280" y="458" class="human-text" text-anchor="middle">curator: decides tier C / needs_curation rows, adds PDFs, re-runs search</text>
  <rect x="20" y="486" width="520" height="114" rx="6" class="box"/>
  <circle cx="42" cy="508" r="11" class="badge"/><text x="42" y="512" class="badge-text">3</text>
  <text x="62" y="513" class="title">biome-finder prepare</text>
  <text x="526" y="512" class="status planned" text-anchor="end">planned</text>
  <text x="42" y="538" class="detail">Keeps the curated rows and routes each sample by its most</text>
  <text x="42" y="556" class="detail">processed data. Writes status and paths back to samples.tsv.</text>
  <text x="42" y="584" class="output">→ catalogue/ · binning/ · assembly/</text>
  <rect x="570" y="486" width="510" height="114" rx="6" class="sources"/>
  <line x1="570" y1="543.0" x2="544" y2="543.0" class="flow" marker-end="url(#arrow)"/>
  <text x="586" y="512" class="source">• ENA / NCBI genome FASTAs (vendored fetch_ena.py, fetch_ncbi.py)</text>
  <text x="586" y="530" class="source">• ENA FTP URLs + md5 for contigs and reads (not downloaded)</text>
  <line x1="280" y1="600" x2="280" y2="660" class="flow" marker-end="url(#arrow)"/>
  <rect x="30" y="618" width="500" height="26" rx="13" class="human"/>
  <text x="280" y="636" class="human-text" text-anchor="middle">run miassembler on assembly/samplesheet.csv</text>
  <rect x="20" y="664" width="520" height="114" rx="6" class="box"/>
  <circle cx="42" cy="686" r="11" class="badge"/><text x="42" y="690" class="badge-text">4</text>
  <text x="62" y="691" class="title">biome-finder link-assemblies</text>
  <text x="526" y="690" class="status planned" text-anchor="end">planned</text>
  <text x="42" y="716" class="detail">After miassembler: builds the genomes-generation inputs</text>
  <text x="42" y="734" class="detail">from its assemblies.</text>
  <text x="42" y="762" class="output">→ binning/</text>
  <rect x="570" y="664" width="510" height="114" rx="6" class="sources"/>
  <line x1="570" y1="721.0" x2="544" y2="721.0" class="flow" marker-end="url(#arrow)"/>
  <text x="586" y="690" class="source">• miassembler output folder (local)</text>
  <line x1="280" y1="778" x2="280" y2="838" class="flow" marker-end="url(#arrow)"/>
  <rect x="20" y="842" width="1060" height="44" rx="6" fill="#1f2933"/>
  <text x="550" y="869" class="downstream" text-anchor="middle">genomes-catalogue-pipeline · genomes-generation · miassembler (outside biome-finder)</text>
</svg>
