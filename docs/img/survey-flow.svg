<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1088" viewBox="0 0 1000 1088" font-family="Helvetica, Arial, sans-serif">
  <title>How a biome config drives biome-finder survey (example: marine-water-euk)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a99"/></marker>
    <style>
      .yaml text:not(.badge-text), text.comment { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #1f2933; }
      .key { fill: #0b4f8a; font-weight: bold; }
      text.comment { fill: #8a94a0; }
      .badge { fill: #0072B2; }
      .badge-text { fill: #ffffff; font-size: 11px; font-weight: bold; text-anchor: middle; font-family: Helvetica, Arial, sans-serif; }
      .box { fill: #f5f8fb; stroke: #c9d6e3; stroke-width: 1.2; }
      .title { font-size: 15px; font-weight: bold; fill: #1f2933; }
      .detail { font-size: 12.5px; fill: #44515e; }
      .example { font-size: 12.5px; fill: #0072B2; font-style: italic; }
      .heading { font-size: 14px; font-weight: bold; fill: #1f2933; }
      .flow { stroke: #7a8a99; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="1088" fill="#ffffff"/>
  <text x="20" y="38" class="heading">biomes/marine-water-euk.yaml</text>
  <rect x="20" y="52" width="430" height="356" rx="6" fill="#fbfbf8" stroke="#d8d8cf"/>
  <g class="yaml">
    <text x="36" y="82"><tspan class="key">name:</tspan> marine-water-euk</text>
    <circle cx="430" cy="77" r="9" class="badge"/><text x="430" y="81" class="badge-text">7</text>
    <text x="36" y="104"><tspan class="key">kingdom:</tspan> eukaryotes</text>
    <circle cx="430" cy="99" r="9" class="badge"/><text x="430" y="103" class="badge-text">6</text>
    <circle cx="408" cy="99" r="9" class="badge"/><text x="408" y="103" class="badge-text">3</text>
    <circle cx="386" cy="99" r="9" class="badge"/><text x="386" y="103" class="badge-text">1</text>
    <text x="36" y="126"><tspan class="key">mgnify_catalogue:</tspan> marine-eukaryotes-v1-0</text>
    <circle cx="430" cy="121" r="9" class="badge"/><text x="430" y="125" class="badge-text">1</text>
    <text x="36" y="148"><tspan class="key">metagenome_taxa:</tspan></text>
    <circle cx="430" cy="143" r="9" class="badge"/><text x="430" y="147" class="badge-text">2</text>
    <text x="36" y="170">&#160;&#160;- marine metagenome</text>
    <text x="36" y="192">&#160;&#160;- seawater metagenome</text>
    <text x="36" y="214">&#160;&#160;- marine plankton metagenome</text>
    <text x="36" y="236"><tspan class="key">exclude_taxa_extra:</tspan> []</text>
    <circle cx="430" cy="231" r="9" class="badge"/><text x="430" y="235" class="badge-text">3</text>
    <text x="36" y="258"><tspan class="key">host_tax_id:</tspan></text>
    <circle cx="430" cy="253" r="9" class="badge"/><text x="430" y="257" class="badge-text">4</text>
    <text x="36" y="280"><tspan class="key">host_keywords:</tspan> []</text>
    <circle cx="430" cy="275" r="9" class="badge"/><text x="430" y="279" class="badge-text">4</text>
    <text x="36" y="324" class="comment"># not used by survey (search, prepare):</text>
    <text x="36" y="346" class="comment"># catalogue_biome, mgnify_lineages*,</text>
    <text x="36" y="368" class="comment"># envo_*, keywords_*,</text>
    <text x="36" y="390" class="comment"># gold_ecosystems, data_types, …</text>
  </g>
  <text x="490" y="38" class="heading">survey steps</text>
  <rect x="490" y="52" width="490" height="86" rx="6" class="box"/>
  <circle cx="512" cy="74" r="11" class="badge"/><text x="512" y="78" class="badge-text">1</text>
  <text x="532" y="79" class="title">Catalogue context</text>
  <text x="512" y="102" class="detail">MGnify API v2 · type must match kingdom · last update = cutoff</text>
  <text x="512" y="124" class="example">eukaryotes ✓ · 74 species · “new” = public since 2026-10-27</text>
  <line x1="735" y1="138" x2="735" y2="154" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="158" width="490" height="106" rx="6" class="box"/>
  <circle cx="512" cy="180" r="11" class="badge"/><text x="512" y="184" class="badge-text">2</text>
  <text x="532" y="185" class="title">Metagenome taxa → tax IDs</text>
  <text x="512" y="208" class="detail">each name → its ENA tax ID → three searches and one output row</text>
  <text x="512" y="230" class="example">marine metagenome → 408172 · seawater metagenome → 1561972</text>
  <text x="512" y="250" class="example">marine plankton metagenome → 1874687</text>
  <line x1="735" y1="264" x2="735" y2="280" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="284" width="490" height="124" rx="6" class="box"/>
  <circle cx="512" cy="306" r="11" class="badge"/><text x="512" y="310" class="badge-text">3</text>
  <text x="532" y="311" class="title">ENA searches, per taxon</text>
  <text x="512" y="334" class="detail">MAGs, bins: only the config&#x27;s kingdom, minus the excluded taxa</text>
  <text x="512" y="352" class="detail">assemblies, runs: whole communities; eukaryote subset in step 6</text>
  <text x="512" y="374" class="example">61 eukaryote MAGs (of 213,712 of any kingdom) + 235 MGnify bins (step 5)</text>
  <text x="512" y="394" class="example">4,616 eukaryote assemblies (of 20,349) · 5,346 runs (of 30,542)</text>
  <line x1="735" y1="408" x2="735" y2="424" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="428" width="490" height="122" rx="6" class="box"/>
  <circle cx="512" cy="450" r="11" class="badge"/><text x="512" y="454" class="badge-text">4</text>
  <text x="532" y="455" class="title">Host filter (host-associated biomes only)</text>
  <text x="512" y="478" class="detail">runs, assemblies: sample host tax ID = host_tax_id,</text>
  <text x="512" y="496" class="detail">or the free-text host contains one of host_keywords</text>
  <text x="512" y="514" class="detail">MAGs: derived from → source samples; kept only if all pass</text>
  <text x="512" y="536" class="example">not applied: marine water has no host</text>
  <line x1="735" y1="550" x2="735" y2="566" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="570" width="490" height="124" rx="6" class="box"/>
  <circle cx="512" cy="592" r="11" class="badge"/><text x="512" y="596" class="badge-text">5</text>
  <text x="532" y="597" class="title">MGnify&#x27;s own data</text>
  <text x="512" y="620" class="detail">records in MGnify&#x27;s ENA studies (center contains EMG), plus the</text>
  <text x="512" y="638" class="detail">bins MGnify made from this biome&#x27;s samples (binned metagenome)</text>
  <text x="512" y="660" class="example">38 MAGs + 235 bins, all eukaryote (259 of the catalogue&#x27;s 294 MAGs)</text>
  <text x="512" y="680" class="example">1,356 eukaryote assemblies (of 6,112 MGnify assemblies)</text>
  <line x1="735" y1="694" x2="735" y2="710" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="714" width="490" height="142" rx="6" class="box"/>
  <circle cx="512" cy="736" r="11" class="badge"/><text x="512" y="740" class="badge-text">6</text>
  <text x="532" y="741" class="title">Kingdom evidence (assemblies, runs)</text>
  <text x="512" y="764" class="detail">genome: the sample already yielded a genome of the kingdom</text>
  <text x="512" y="782" class="detail">text: one of the sample&#x27;s projects names the kingdom</text>
  <text x="512" y="800" class="detail">eukaryotes need one of these; prokaryotes skip only euk-only projects</text>
  <text x="512" y="822" class="example">eukaryote assemblies: 4,616 (411 genome · 4,205 text) of 20,349</text>
  <text x="512" y="842" class="example">eukaryote runs ≥ 1 M: 3,427 (134 genome · 3,293 text) of 22,741</text>
  <line x1="735" y1="856" x2="735" y2="872" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="876" width="490" height="106" rx="6" class="box"/>
  <circle cx="512" cy="898" r="11" class="badge"/><text x="512" y="902" class="badge-text">7</text>
  <text x="532" y="903" class="title">Summarize</text>
  <text x="512" y="926" class="detail">per taxon + TOTAL · runs ≥ 1 M reads · paired / long · new</text>
  <text x="512" y="948" class="example">eukaryote: 61 MAGs · 235 MGnify bins · 4,616 assemblies</text>
  <text x="512" y="968" class="example">3,427 runs ≥ 1 M (86,629 Gbases) · 12 new since the cutoff</text>
  <line x1="735" y1="982" x2="735" y2="998" class="flow" marker-end="url(#arrow)"/>
  <rect x="490" y="1002" width="490" height="62" rx="6" fill="#1f2933"/>
  <text x="735" y="1028" fill="#ffffff" font-size="13.5px" font-weight="bold" text-anchor="middle">survey/</text>
  <text x="735" y="1050" fill="#dfe6ee" font-size="12.5px" text-anchor="middle">survey.tsv · biomes/&lt;name&gt;/records.tsv, studies.tsv · report.html</text>
</svg>
