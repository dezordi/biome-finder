# Scope decided 2026-11-26: lakes, rivers and ponds in one catalogue, as configured below.
name: freshwater-water-prok
kingdom: prokaryotes               # prokaryotes | eukaryotes: MGnify catalogue type (pipeline --kingdom)
mgnify_catalogue: ""
catalogue_biome: "root:Environmental:Aquatic:Freshwater"
mgnify_lineages: 
  - "root:Environmental:Aquatic:Freshwater:Lake"
  - "root:Environmental:Aquatic:Freshwater:Lotic"
  - "root:Environmental:Aquatic:Freshwater:Lentic"
  - "root:Environmental:Aquatic:Freshwater:Pond"
mgnify_lineages_exclude:
  - "root:Environmental:Aquatic:Freshwater:Lentic:Sediment"
  - "root:Environmental:Aquatic:Freshwater:Lotic:Sediment"
  - "root:Environmental:Aquatic:Freshwater:Pond:Sediment"
envo_include: 
  - ENVO:00000021  # freshwater lake
  - ENVO:01000599  # river water
  - ENVO:01000253  # freshwater river biome
  - ENVO:00002011  # fresh water
  - ENVO:00000873  # freshwater biome
  - ENVO:04000007  # lake water
  - ENVO:01000297  # freshwater river
  - ENVO:00002131  # epilimnion
  - ENVO:00000033  # pond
  - ENVO:00000022  # river
  - ENVO:00000020  # lake
envo_exclude:  # an excluded term wins over an included one above it
  - ENVO:00002007  # sediment
  - ENVO:00000019  # saline lake
  - ENVO:01001020  # hypersaline lake
  - ENVO:00000540  # brackish lake
  - ENVO:00000541  # brackish pond
  - ENVO:00000055  # saline evaporation pond
  - ENVO:00003064  # drinking water
  - ENVO:00000058  # underground lake
  - ENVO:00000059  # underground river
  - ENVO:03600092  # artificial pond
  - ENVO:00000449  # drinking water reservoir: not an environmental sample
  - ENVO:00000056  # fishpond: "used for the artificial culture of fish"
gold_ecosystems: 
  - "Environmental > Aquatic > Freshwater"
gold_ecosystems_exclude:  # GOLD files these under Freshwater (export of 2026-11-25)
  - "Environmental > Aquatic > Freshwater > Sediment"
  - "Environmental > Aquatic > Freshwater > Lake > Sediment"
  - "Environmental > Aquatic > Freshwater > River > Sediment"
  - "Environmental > Aquatic > Freshwater > Pond > Sediment"
  - "Environmental > Aquatic > Freshwater > Creek > Sediment"
  - "Environmental > Aquatic > Freshwater > Lentic > Sediment"
  - "Environmental > Aquatic > Freshwater > Reservoir > Sediment"
  - "Environmental > Aquatic > Freshwater > Drainage ditch > Sediment"
  - "Environmental > Aquatic > Freshwater > Canal > Sediment"
  - "Environmental > Aquatic > Freshwater > Groundwater"
  - "Environmental > Aquatic > Freshwater > Drinking water"
  - "Environmental > Aquatic > Freshwater > Tap water"
  - "Environmental > Aquatic > Freshwater > Water tank"
  - "Environmental > Aquatic > Freshwater > Sterile water"
  - "Environmental > Aquatic > Freshwater > Wetlands"
  - "Environmental > Aquatic > Freshwater > Ice"
  - "Environmental > Aquatic > Freshwater > Glacier"
  - "Environmental > Aquatic > Freshwater > Subglacial lake"
metagenome_taxa: 
  - "freshwater metagenome"
  - "lake water metagenome"
  - "lake metagenome"
  - "riverine metagenome"
  - "pond metagenome"
keywords_include: 
  - "lake water"
  - "river water"
  - "freshwater"
keywords_exclude: 
  - "marine"
  - "estuar"
  - "brackish"
  - "saline"
  - "soda lake"
  - "sediment"
  - "wastewater"
  - "groundwater"
  - "drinking water"
  - "fishpond"
  - "fish pond"
  - "aquaculture"
  - "mesocosm"
  - "microcosm"
  - "spiked"
  - "mock"
  - "synthetic"
  - "control"
host: none
host_tax_id: 
contaminant_reference: ""
data_types: [mag, isolate, contigs, reads]
exclude_taxa_extra: []
lineage_equivalents: {}
ncbi_isolate_query: ""
ncbi_wgs_terms: []
min_study_yield: 0.3
indicpiper_habitats: 
  - "freshwater water"
notes: "Lakes, rivers and ponds in one catalogue (2026-11-26); groundwater excluded. Lentic/Lotic/Pond :Sediment subtrees excluded (freshwater-sediment). glacier lake metagenome (Ice:Glacial lake) not included."
